name: Deploy to Staging

on:
  push:
    branches:
      - staging
    paths:
      - 'frontend/**'
      - 'backend/**'
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Clean previous build cache
        working-directory: ./frontend
        run: |
          rm -rf dist
          rm -rf node_modules/.astro
          echo "Previous build artifacts and cache cleaned."

      - name: Create staging config.php
        run: |
          # Create the API config file from staging secrets
          mkdir -p ./deploy/public_html/api

          # This creates the staging config.php using the GitHub secrets
          # It includes all your staging settings and helper functions
          echo "<?php
          /**
           * STAGING CONFIGURATION (Auto-generated by deploy workflow)
           */

          // ========================================
          // HOSTINGER STAGING DATABASE CREDENTIALS
          // ========================================
          define('DB_HOST', '${{ secrets.STAGING_DB_HOST }}');
          define('DB_USER', '${{ secrets.STAGING_DB_USER }}');
          define('DB_PASS', '${{ secrets.STAGING_DB_PASS }}');
          define('DB_NAME', '${{ secrets.STAGING_DB_NAME }}');

          // ========================================
          // CORS SETTINGS (Staging)
          // ========================================
          \$allowed_origins = [
              'https://staging.wherecanifish.com',
              'http://localhost:4321'
          ];

          // ========================================
          // RATE LIMITING (More relaxed for testing)
          // ========================================
          define('RATE_LIMIT_SUBMISSIONS', 10);
          define('RATE_LIMIT_VOTES', 50);

          /*
           * Simple maintenance mode check
           * Create a file named MAINTENANCE in the document root to enable maintenance mode
           * All requests will receive a 503 response
           */

          // Check for MAINTENANCE file in document root
          \$maintenance_file = rtrim(\$_SERVER['DOCUMENT_ROOT'] ?? __DIR__ . '/..', \"\\\\/\") . '/MAINTENANCE';

          if (file_exists(\$maintenance_file)) {
              // Determine if this is an API request or browser request
              \$accept = \$_SERVER['HTTP_ACCEPT'] ?? '';
              \$request_uri = \$_SERVER['REQUEST_URI'] ?? '';

              if (strpos(\$request_uri, '/api/') === 0 || strpos(\$accept, 'application/json') !== false) {
                  // API request - return JSON error
                  http_response_code(503);
                  header('Content-Type: application/json');
                  header('Retry-After: 3600'); // Suggest retry in 1 hour
                  echo json_encode([
                      'error' => 'Staging site is temporarily down for maintenance. Please try again later.',
                      'maintenance' => true
                  ]);
                  exit;
              } else {
                  // Browser request - show maintenance page
                  \$htmlPath = rtrim(\$_SERVER['DOCUMENT_ROOT'] ?? __DIR__ . '/..', \"\\\\/\") . '/maintenance.html';
                  if (file_exists(\$htmlPath)) {
                      http_response_code(503);
                      header('Content-Type: text/html');
                      header('Retry-After: 3600');
                      echo file_get_contents(\$htmlPath);
                      exit;
                  }

                  // Fallback if maintenance.html doesn't exist
                  http_response_code(503);
                  header('Content-Type: text/plain');
                  header('Retry-After: 3600');
                  echo 'Staging site is temporarily down for maintenance. Please try again later.';
                  exit;
              }
          }

          // ========================================
          // HELPER FUNCTIONS
          // ========================================

          function get_db_connection() {
              \$conn = new mysqli(DB_HOST, DB_USER, DB_PASS, DB_NAME);
              if (\$conn->connect_error) {
                  error_log('Database connection failed: ' . \$conn->connect_error);
                  http_response_code(500);
                  die(json_encode(['error' => 'Database connection failed']));
              }
              \$conn->set_charset('utf8mb4');
              return \$conn;
          }

          function set_cors_headers() {
              global \$allowed_origins;
              \$origin = isset(\$_SERVER['HTTP_ORIGIN']) ? \$_SERVER['HTTP_ORIGIN'] : '';
              if (in_array(\$origin, \$allowed_origins)) {
                  header('Access-Control-Allow-Origin: ' . \$origin);
              }
              header('Access-Control-Allow-Methods: GET, POST, OPTIONS');
              header('Access-Control-Allow-Headers: Content-Type');
              header('Access-Control-Max-Age: 86400');
              if (\$_SERVER['REQUEST_METHOD'] === 'OPTIONS') {
                  http_response_code(200);
                  exit;
              }
          }

          function get_ip_hash() {
              \$ip = \$_SERVER['REMOTE_ADDR'] ?? 'unknown';
              return hash('sha256', \$ip . date('Y-m-d H'));
          }

          function send_json(\$data, \$status = 200) {
              http_response_code(\$status);
              header('Content-Type: application/json');
              echo json_encode(\$data);
              exit;
          }
          ?>" > ./deploy/public_html/api/config.php

      - name: Prepare API deployment
        run: |
          mkdir -p deploy/api
          # Copy all of backend/api EXCEPT config.php (which we just generated)
          rsync -av --progress backend/api/ deploy/api/ --exclude config.php
          cp deploy/public_html/api/config.php deploy/api/config.php

      - name: Deploy API to Hostinger Staging first
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.STAGING_FTP_SERVER }}
          username: ${{ secrets.STAGING_FTP_USERNAME }}
          password: ${{ secrets.STAGING_FTP_PASSWORD }}
          local-dir: ./deploy/api/
          server-dir: /public_html/staging/api/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**

      - name: Wait for API to be ready
        run: |
          echo "Waiting 10 seconds for API to be ready..."
          sleep 10

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Create .env.production file for staging
        working-directory: ./frontend
        run: |
          # Create .env.production with staging values
          echo "PUBLIC_MAPBOX_TOKEN=${{ secrets.PUBLIC_MAPBOX_TOKEN }}" >> .env.production
          echo "PUBLIC_API_URL=${{ secrets.STAGING_API_URL }}" >> .env.production
          echo "PUBLIC_SITE_URL=https://staging.wherecanifish.com" >> .env.production
          echo "--- Verifying .env file location ---"
          ls -la
          echo "------------------------------------"

      - name: Build frontend with staging config
        working-directory: ./frontend
        env:
          ASTRO_SITE: https://staging.wherecanifish.com
        run: npm run build

      - name: Prepare frontend deployment
        run: |
          mkdir -p deploy/frontend
          cp -r frontend/dist/* deploy/frontend/

      - name: Deploy frontend to Hostinger Staging
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.STAGING_FTP_SERVER }}
          username: ${{ secrets.STAGING_FTP_USERNAME }}
          password: ${{ secrets.STAGING_FTP_PASSWORD }}
          local-dir: ./deploy/frontend/
          server-dir: /public_html/staging/
          # Only upload changed files (much faster)
          # Set to true only if you need to wipe everything and start fresh
          dangerous-clean-slate: false
          exclude: |
            .git/**
            .github/**
            .gitignore
            **/node_modules/**
            **/api/**
            MAINTENANCE
            MAINTENANCE_WHITELIST

      - name: Deployment complete
        run: |
          echo "✅ Deployment to staging.wherecanifish.com complete!"
          echo "🔗 https://staging.wherecanifish.com"
