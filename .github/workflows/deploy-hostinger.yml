name: Deploy to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'backend/**'
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install pymysql

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Export data for build
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          # This would connect to your production database
          # For now, we'll use a placeholder since we can't access local DB from GitHub
          echo "Note: In production, this would export from your database"
          # python export_for_build.py

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Prepare deployment files
        run: |
          mkdir -p deploy/public_html
          cp -r frontend/dist/* deploy/public_html/
          cp -r backend/api deploy/public_html/
          cp backend/api/config.prod.php deploy/public_html/api/config.php

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/public_html/
          server-dir: ./public_html/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            data/fishing-spots.json

      - name: Deployment complete
        run: |
          echo "✅ Deployment to wherecanifish.com complete!"
          echo "🔗 https://wherecanifish.com"
