name: Deploy to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'backend/**'
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Clean previous build cache
        working-directory: ./frontend
        run: |
          rm -rf dist
          rm -rf node_modules/.astro
          echo "Previous build artifacts and cache cleaned."

      - name: Create production config.php
        run: |
          # Create the API config file from secrets
          mkdir -p ./deploy/public_html/api
          
          # This creates the production config.php using the GitHub secrets
          # It includes all your production settings and helper functions
          echo "<?php
          /**
           * PRODUCTION CONFIGURATION (Auto-generated by deploy workflow)
           */
          
          // ========================================
          // HOSTINGER DATABASE CREDENTIALS
          // ========================================
          define('DB_HOST', '${{ secrets.DB_HOST }}');
          define('DB_USER', '${{ secrets.DB_USER }}');
          define('DB_PASS', '${{ secrets.DB_PASS }}');
          define('DB_NAME', '${{ secrets.DB_NAME }}');
          
          // ========================================
          // CORS SETTINGS
          // ========================================
          \$allowed_origins = [
              'https://wherecanifish.com',
              'https://www.wherecanifish.com'
          ];
          
          // ========================================
          // RATE LIMITING
          // ========================================
          define('RATE_LIMIT_SUBMISSIONS', 3);
          define('RATE_LIMIT_VOTES', 10);

          /*
           * Maintenance mode logic
           */
          function is_whitelisted_ip(\$ip, \$whitelistPaths) {
              if (!\$ip) return false;
              foreach (\$whitelistPaths as \$p) {
                  if (!file_exists(\$p)) continue;
                  \$lines = preg_split('/\r?\n/', file_get_contents(\$p));
                  foreach (\$lines as \$line) {
                      \$line = trim(\$line);
                      if (\$line === '' || strpos(\$line, '#') === 0) continue;
                      if (\$line === \$ip) return true;
                  }
              }
              if (php_sapi_name() === 'cli' || in_array(\$ip, ['127.0.0.1', '::1'])) return true;
              return false;
          }

          \$candidates = [
              __DIR__ . '/../MAINTENANCE',
          ];
          if (!empty(\$_SERVER['DOCUMENT_ROOT'])) {
              \$candidates[] = rtrim(\$_SERVER['DOCUMENT_ROOT'], \"\\\\/\") . '/MAINTENANCE';
          }

          \$maintenance_on = false;
          foreach (\$candidates as \$c) {
              if (file_exists(\$c)) { \$maintenance_on = true; break; }
          }

          if (\$maintenance_on) {
              \$remote_ip = \$_SERVER['REMOTE_ADDR'] ?? '';
              \$whitelistPaths = [
                  __DIR__ . '/../MAINTENANCE_WHITELIST'
              ];
              if (!empty(\$_SERVER['DOCUMENT_ROOT'])) {
                  \$whitelistPaths[] = rtrim(\$_SERVER['DOCUMENT_ROOT'], \"\\\\/\") . '/MAINTENANCE_WHITELIST';
              }

              if (!is_whitelisted_ip(\$remote_ip, \$whitelistPaths)) {
                  \$accept = \$_SERVER['HTTP_ACCEPT'] ?? '';
                  \$request_uri = \$_SERVER['REQUEST_URI'] ?? '';
                  if (strpos(\$request_uri, '/api/') === 0 || strpos(\$accept, 'application/json') !== false) {
                      http_response_code(503);
                      header('Content-Type: application/json');
                      echo json_encode(['error' => 'Site is temporarily down for maintenance. Please try again later.']);
                      exit;
                  }
                  \$htmlPath = rtrim(\$_SERVER['DOCUMENT_ROOT'], \"\\\\/\") . '/maintenance.html';
                  if (file_exists(\$htmlPath)) {
                      http_response_code(503);
                      header('Content-Type: text/html');
                      echo file_get_contents(\$htmlPath);
                      exit;
                  }
                  http_response_code(503);
                  header('Content-Type: text/plain');
                  echo 'Site is temporarily down for maintenance. Please try again later.';
                  exit;
              }
          }
          
          // ========================================
          // HELPER FUNCTIONS
          // ========================================

          function get_db_connection() {
              \$conn = new mysqli(DB_HOST, DB_USER, DB_PASS, DB_NAME);
              if (\$conn->connect_error) {
                  error_log('Database connection failed: ' . \$conn->connect_error);
                  http_response_code(500);
                  die(json_encode(['error' => 'Database connection failed']));
              }
              \$conn->set_charset('utf8mb4');
              return \$conn;
          }
          
          function set_cors_headers() {
              global \$allowed_origins;
              \$origin = isset(\$_SERVER['HTTP_ORIGIN']) ? \$_SERVER['HTTP_ORIGIN'] : '';
              if (in_array(\$origin, \$allowed_origins)) {
                  header('Access-Control-Allow-Origin: ' . \$origin);
              }
              header('Access-Control-Allow-Methods: GET, POST, OPTIONS');
              header('Access-Control-Allow-Headers: Content-Type');
              header('Access-Control-Max-Age: 86400');
              if (\$_SERVER['REQUEST_METHOD'] === 'OPTIONS') {
                  http_response_code(200);
                  exit;
              }
          }
          
          function get_ip_hash() {
              \$ip = \$_SERVER['REMOTE_ADDR'] ?? 'unknown';
              return hash('sha256', \$ip . date('Y-m-d H'));
          }
          
          function send_json(\$data, \$status = 200) {
              http_response_code(\$status);
              header('Content-Type: application/json');
              echo json_encode(\$data);
              exit;
          }
          ?>" > ./deploy/public_html/api/config.php

      - name: Prepare API deployment
        run: |
          mkdir -p deploy/api
          # Copy all of backend/api EXCEPT config.php (which we just generated)
          rsync -av --progress backend/api/ deploy/api/ --exclude config.php
          cp deploy/public_html/api/config.php deploy/api/config.php

      - name: Deploy API to Hostinger first
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/api/
          server-dir: /public_html/api/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**

      - name: Wait for API to be ready
        run: |
          echo "Waiting 10 seconds for API to be ready..."
          sleep 10

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Create .env.production file
        working-directory: ./frontend
        run: |
          # Create .env.production, which astro build specifically looks for
          echo "PUBLIC_MAPBOX_TOKEN=${{ secrets.PUBLIC_MAPBOX_TOKEN }}" >> .env.production
          echo "PUBLIC_API_URL=${{ secrets.PUBLIC_API_URL }}" >> .env.production
          echo "--- Verifying .env file location ---"
          ls -la
          echo "------------------------------------"

      - name: Build frontend (API is now live)
        working-directory: ./frontend
        run: npm run build

      - name: Prepare frontend deployment
        run: |
          mkdir -p deploy/frontend
          cp -r frontend/dist/* deploy/frontend/

      - name: Deploy frontend to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/frontend/
          server-dir: /public_html/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/api/**

      - name: Deployment complete
        run: |
          echo "✅ Deployment to wherecanifish.com complete!"
          echo "🔗 https://wherecanifish.com"

