name: Toggle Staging Maintenance Mode

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Maintenance mode action'
        required: true
        type: choice
        options:
          - enable
          - disable
        default: 'enable'

jobs:
  toggle-maintenance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Maintenance Mode
        if: ${{ github.event.inputs.action == 'enable' }}
        run: |
          # Install lftp for FTP operations
          sudo apt-get update
          sudo apt-get install -y lftp

          # Create empty MAINTENANCE file
          touch MAINTENANCE

          # Upload MAINTENANCE file via FTP (single file upload, no sync)
          lftp -c "
          open ftp://${{ secrets.STAGING_FTP_USERNAME }}:${{ secrets.STAGING_FTP_PASSWORD }}@${{ secrets.STAGING_FTP_SERVER }}
          cd /public_html/staging
          put MAINTENANCE
          bye
          "
          echo "✅ Maintenance mode file uploaded"

      - name: Disable Maintenance Mode (Delete MAINTENANCE file)
        if: ${{ github.event.inputs.action == 'disable' }}
        run: |
          # Install lftp for FTP operations
          sudo apt-get update
          sudo apt-get install -y lftp

          # Delete MAINTENANCE file via FTP
          lftp -c "
          open ftp://${{ secrets.STAGING_FTP_USERNAME }}:${{ secrets.STAGING_FTP_PASSWORD }}@${{ secrets.STAGING_FTP_SERVER }}
          cd /public_html/staging
          rm -f MAINTENANCE
          bye
          "
          echo "Maintenance mode disabled - MAINTENANCE file deleted"

      - name: Verify Action
        run: |
          if [ "${{ github.event.inputs.action }}" == "enable" ]; then
            echo "✅ Maintenance mode ENABLED on staging.wherecanifish.com"
            echo "🔧 Staging site is now in maintenance mode"
            echo "ℹ️  To disable, run this workflow again and select 'disable'"
          else
            echo "✅ Maintenance mode DISABLED on staging.wherecanifish.com"
            echo "🚀 Staging site is now live"
            echo "ℹ️  To enable, run this workflow again and select 'enable'"
          fi
