# IMPORTANT: Use 'docker compose up' NOT 'docker compose restart'
# The 'restart' command doesn't respect depends_on health checks
# Use the restart.bat (Windows) or restart.sh (Mac/Linux) scripts

services:
  # MySQL 8.0 Database
  mysql:
    image: mysql:8.0
    container_name: fishing_directory_db
    restart: unless-stopped
    ports:
      - "3307:3306"  # Host 3307 to avoid conflict with fishing-data-pipeline's MySQL on 3306; internal port unchanged
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=fishing_directory
      - MYSQL_USER=fishing_user
      - MYSQL_PASSWORD=fishing_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d  # Optional: auto-run SQL scripts on first start
    networks:
      - fishing_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "fishing_user", "-pfishing_password"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # phpMyAdmin for Database Management
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: fishing_directory_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"  # Change to "8081:80" if 8080 is already in use
    environment:
      - PMA_HOST=mysql
      - PMA_USER=fishing_user
      - PMA_PASSWORD=fishing_password
      - MYSQL_ROOT_PASSWORD=root_password
    networks:
      - fishing_network
    depends_on:
      mysql:
        condition: service_healthy

  # PHP API Server (connects to MySQL database)
  php:
    image: php:8.2-apache
    container_name: fishing_directory_api
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend/api:/var/www/html
    environment:
      # Connect to MySQL container (use 'mysql' as hostname, not 'localhost')
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=fishing_directory
      - DB_USER=fishing_user
      - DB_PASSWORD=fishing_password
    networks:
      - fishing_network
    command: >
      bash -c "docker-php-ext-install mysqli pdo pdo_mysql
      && apache2-foreground"
    healthcheck:
      test: ["CMD-SHELL", "service apache2 status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy

  # Astro Frontend Dev Server
  astro:
    image: node:18-alpine
    container_name: fishing_directory_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Use container's node_modules, not host's
    ports:
      - "4321:4321"
    environment:
      - NODE_ENV=development
      - PUBLIC_API_URL=http://php:80
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - fishing_network
    depends_on:
      php:
        condition: service_healthy

volumes:
  mysql_data:
    driver: local

networks:
  fishing_network:
    driver: bridge