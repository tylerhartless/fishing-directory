services:
  # PHP API Server (connects to external MySQL database)
  php:
    image: php:8.2-apache
    container_name: fishing_directory_api
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend/api:/var/www/html
    environment:
      # Connect to external MySQL database (running in data-pipeline repo or remote)
      - DB_HOST=${DB_HOST:-localhost}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-fishing_directory}
      - DB_USER=${DB_USER:-fishing_user}
      - DB_PASSWORD=${DB_PASSWORD:-fishing_password}
    networks:
      - fishing_network
    command: >
      bash -c "docker-php-ext-install mysqli pdo pdo_mysql
      && apache2-foreground"

  # Astro Frontend Dev Server
  astro:
    image: node:18-alpine
    container_name: fishing_directory_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Use container's node_modules, not host's
    ports:
      - "4321:4321"
    environment:
      - NODE_ENV=development
      - PUBLIC_API_URL=http://php:80
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - fishing_network
    depends_on:
      - php

networks:
  fishing_network:
    driver: bridge