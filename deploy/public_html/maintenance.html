<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Site maintenance</title>
    <style>
      body{font-family:Inter,system-ui,Arial,Helvetica,sans-serif;background:#f5f7fb;color:#0b1220;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
      .card{max-width:720px;padding:28px;border-radius:10px;background:white;box-shadow:0 6px 24px rgba(11,18,32,.08);text-align:center}
      h1{margin:0 0 8px;font-size:28px}
      p{margin:0 0 16px;color:#4b5563}
      small{color:#6b7280}
    </style>
  </head>
  <body>
    <div class="card">
      <h1>We'll be back soon</h1>
      <p>We're performing scheduled maintenance to improve the site. Please check back shortly.</p>
      <p><small>If you need immediate access, whitelist your IP in <code>MAINTENANCE_WHITELIST</code> or contact the site admin.</small></p>
    </div>
  </body>
</html>
