<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Gone Fishin' - Maintenance</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Georgia', serif;
        background: linear-gradient(135deg, #2c5530 0%, #4a7c59 100%);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
      }
      .container {
        max-width: 600px;
        text-align: center;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        padding: 60px 40px;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }
      .fish-icon {
        font-size: 80px;
        margin-bottom: 20px;
        animation: swim 2s ease-in-out infinite;
      }
      @keyframes swim {
        0%, 100% { transform: translateX(0) rotateY(0deg); }
        50% { transform: translateX(20px) rotateY(180deg); }
      }
      h1 {
        font-size: 48px;
        margin-bottom: 20px;
        color: #fff;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      }
      .sign {
        background: #8b4513;
        color: #f5deb3;
        padding: 20px 30px;
        border-radius: 10px;
        display: inline-block;
        margin: 20px 0;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        border: 3px solid #654321;
        font-family: 'Courier New', monospace;
        font-size: 24px;
        font-weight: bold;
        transform: rotate(-2deg);
      }
      p {
        font-size: 18px;
        line-height: 1.6;
        color: #f0f0f0;
        margin: 20px 0;
      }
      .hook {
        display: inline-block;
        animation: bob 1.5s ease-in-out infinite;
      }
      @keyframes bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      small {
        color: rgba(255, 255, 255, 0.8);
        font-size: 14px;
        display: block;
        margin-top: 30px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="fish-icon">🎣</div>
      <h1>Gone Fishin'!</h1>
      <div class="sign">~ Back Soon ~</div>
      <p>
        We're currently doing some maintenance to make your fishing experience even better.
      </p>
      <p class="hook">🪝</p>
      <p>
        The site will be back up shortly. Thanks for your patience!
      </p>
      <small>While you wait, why not check your tackle box? 🎣</small>
    </div>
  </body>
</html>
