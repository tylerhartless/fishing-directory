<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Gone Fishin' - Maintenance</title>
    <style>
      :root {
        /* Earthy colors matching site */
        --earth-rust: #b85c3a;
        --earth-sand: #d4a574;
        --earth-olive: #7a8450;
        --earth-forest: #4a6741;
        --primary-bg: #3d5a3d;
        --accent-cream: #f0e6d2;
        --accent-rust: #b85c3a;
        --neutral-black: #2d2d2d;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: var(--primary-bg);
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
      }

      .stitching-line {
        width: 100%;
        height: 4px;
        background: repeating-linear-gradient(
          to right,
          var(--earth-rust) 0px,
          var(--earth-rust) 8px,
          transparent 8px,
          transparent 16px
        );
        position: absolute;
        top: 0;
      }

      .container {
        max-width: 600px;
        text-align: center;
        background: white;
        padding: 3rem 2.5rem;
        border: 4px solid var(--neutral-black);
        box-shadow: 8px 8px 0 rgba(0,0,0,0.3);
        color: var(--neutral-black);
      }

      .logo {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        margin-bottom: 2rem;
      }

      .logo-fish {
        font-size: 3rem;
        font-family: monospace;
        color: var(--accent-rust);
        animation: swim 2s ease-in-out infinite;
      }

      @keyframes swim {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(10px); }
      }

      h1 {
        font-size: 2.5rem;
        margin-bottom: 1.5rem;
        color: var(--neutral-black);
        font-weight: 900;
        letter-spacing: 0.05em;
        text-shadow: 3px 3px 0 rgba(0,0,0,0.1);
      }

      .sign {
        background: var(--accent-cream);
        color: var(--neutral-black);
        padding: 1rem 2rem;
        display: inline-block;
        margin: 1.5rem 0;
        box-shadow: 4px 4px 0 rgba(0,0,0,0.2);
        border: 3px solid var(--neutral-black);
        font-family: monospace;
        font-size: 1.5rem;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }

      p {
        font-size: 1.1rem;
        line-height: 1.6;
        color: var(--neutral-black);
        margin: 1.5rem 0;
        font-weight: 500;
      }

      .hook {
        display: inline-block;
        animation: bob 1.5s ease-in-out infinite;
        font-size: 2rem;
      }

      @keyframes bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }

      small {
        color: #666;
        font-size: 0.9rem;
        display: block;
        margin-top: 2rem;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="stitching-line"></div>
    <div class="container">
      <div class="logo">
        <span class="logo-fish">><></span>
      </div>
      <h1>Gone Fishin'!</h1>
      <div class="sign">Back Soon</div>
      <p>
        We're currently doing some maintenance to make your fishing experience even better.
      </p>
      <p class="hook">🪝</p>
      <p>
        The site will be back up shortly. Thanks for your patience!
      </p>
      <small>While you wait, why not check your tackle box? 🎣</small>
    </div>
  </body>
</html>
