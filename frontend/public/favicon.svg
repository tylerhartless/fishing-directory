<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Glow filter for dark mode -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur1"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur2"/>
      <feFlood flood-color="rgba(144, 238, 144, 0.8)" result="glowColor1"/>
      <feFlood flood-color="rgba(144, 238, 144, 0.6)" result="glowColor2"/>
      <feComposite in="glowColor1" in2="blur1" operator="in" result="glow1"/>
      <feComposite in="glowColor2" in2="blur2" operator="in" result="glow2"/>
      <feMerge>
        <feMergeNode in="glow2"/>
        <feMergeNode in="glow1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Text shadow layer -->
  <text 
    x="66" 
    y="82" 
    font-family="'Press Start 2P', monospace" 
    font-size="48" 
    text-anchor="middle" 
    fill="rgba(0, 0, 0, 0.3)"
    letter-spacing="-0.15em"
    class="shadow-text"
  >&gt;&lt;&gt;</text>
  
  <!-- Main text with glow (dark mode) -->
  <text 
    x="64" 
    y="80" 
    font-family="'Press Start 2P', monospace" 
    font-size="48" 
    text-anchor="middle" 
    fill="#9ab087"
    letter-spacing="-0.15em"
    filter="url(#glow)"
    class="favicon-text"
  >&gt;&lt;&gt;</text>
  
  <style>
    .favicon-text {
      fill: #9ab087;
      filter: url(#glow);
    }
    
    .shadow-text {
      fill: rgba(0, 0, 0, 0.3);
    }
    
    @media (prefers-color-scheme: light) {
      .favicon-text {
        fill: #6b7a5f;
        filter: none;
      }
      
      .shadow-text {
        fill: rgba(0, 0, 0, 0.15);
      }
    }
  </style>
</svg>
